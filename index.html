<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taxi Log</title>
<style>
body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#111}header{background:white;padding:16px;display:flex;justify-content:space-between;position:sticky;top:0;border-bottom:1px solid #ddd}h1{margin:0;font-size:22px}main{max-width:700px;margin:auto;padding:12px 12px 80px}.card{background:white;border-radius:16px;padding:16px;margin:10px 0}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#777;font-size:12px;padding:5px}.day{min-height:72px;border:1px solid #ddd;background:#fafafa;border-radius:9px;text-align:left;padding:5px}.has{background:#edf5ff}.sale{font-size:10px;margin-top:4px}button{border:0;border-radius:10px;padding:10px 13px;background:#111;color:#fff;font-size:15px}button.gray{background:#eee;color:#111}input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}label{display:block;color:#666;font-size:13px;margin:10px 0 5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:22px;font-weight:700}.hidden{display:none}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.menu{position:fixed;right:12px;top:62px;background:white;padding:10px;border-radius:14px;box-shadow:0 5px 25px #0003;z-index:9}.menu button{display:block;width:210px;margin:5px}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex}.tabs button{flex:1;background:white;color:#555;border-radius:0;font-size:12px}
</style></head><body>
<header><h1>🚕 Taxi Log</h1><button class="gray" onclick="menu.classList.toggle('hidden')">△</button></header>
<div id="menu" class="menu hidden"><button onclick="page('month')">📊 月間集計</button><button onclick="page('year')">📈 年間集計</button><button onclick="page('settings')">⚙️ 設定</button></div>
<main>
<section id="calPage"><div class="card"><div class="row between"><button class="gray" onclick="move(-1)">‹</button><b id="title"></b><button class="gray" onclick="move(1)">›</button></div><div id="cal" class="cal"></div></div></section>
<section id="editPage" class="hidden"><div class="card"><div class="row between"><h2 id="dateTitle"></h2><button class="gray" onclick="page('cal')">戻る</button></div>
<label>出勤時間</label><input id="start" type="time"><label>退勤時間</label><input id="end" type="time">
<div class="two"><div><label>税込売上</label><input id="gross" type="number"></div><div><label>税抜売上</label><input id="net" type="number"></div></div>
<label>歩合率（変更可能）</label><input id="rate" type="number" value="50" step=".1"><div class="card"><div>総支給</div><div id="pay" class="stat">¥0</div></div>
<div class="row"><button onclick="save()">保存</button><button onclick="del()" style="background:#c33">削除</button></div></div></section>
<section id="monthPage" class="hidden"><div class="card"><div class="row between"><button class="gray" onclick="move(-1);monthly()">‹</button><h2 id="mt"></h2><button class="gray" onclick="move(1);monthly()">›</button></div><div class="two"><div>税込<div id="mg" class="stat"></div></div><div>税抜<div id="mn" class="stat"></div></div><div>総支給<div id="mp" class="stat"></div></div><div>出勤日数<div id="md" class="stat"></div></div></div><label>月間目標（税込）</label><input id="goal" type="number" onchange="goalSave()"><p id="remain"></p></div></section>
<section id="yearPage" class="hidden"><div class="card"><h2 id="yt"></h2><div class="two"><div>税込<div id="yg" class="stat"></div></div><div>税抜<div id="yn" class="stat"></div></div><div>総支給<div id="yp" class="stat"></div></div><div>出勤日数<div id="yd" class="stat"></div></div></div><div id="years"></div></div></section>
<section id="settingsPage" class="hidden"><div class="card"><h2>⚙️ 設定</h2><label>初期歩合率</label><input id="defrate" type="number" step=".1"><button onclick="settingsSave()">保存</button></div></section>
</main><nav class="tabs"><button onclick="page('cal')">📅<br>カレンダー</button><button onclick="page('month')">📊<br>月間</button></nav>
<script>
let db=JSON.parse(localStorage.getItem('taxilog1')||'{"reports":{},"goals":{},"defaultRate":50}'),d=new Date();d.setDate(1),sel='';
const wd=['日','月','火','水','木','金','土'],money=n=>'¥'+Math.round(+n||0).toLocaleString('ja-JP'),key=(y,m,x)=>y+'-'+String(m).padStart(2,'0')+'-'+String(x).padStart(2,'0');
function persist(){localStorage.setItem('taxilog1',JSON.stringify(db))}
function page(x){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));menu.classList.add('hidden');document.getElementById(x==='cal'?'calPage':x==='month'?'monthPage':x==='year'?'yearPage':'settingsPage').classList.remove('hidden');if(x==='cal')render();if(x==='month')monthly();if(x==='year')yearly();if(x==='settings')defrate.value=db.defaultRate}
function move(n){d.setMonth(d.getMonth()+n);render()}
function render(){let y=d.getFullYear(),m=d.getMonth()+1;title.textContent=y+'年'+m+'月';cal.innerHTML=wd.map(x=>'<div class="dow">'+x+'</div>').join('');let f=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();for(let i=0;i<f;i++)cal.innerHTML+='<div></div>';for(let x=1;x<=days;x++){let r=db.reports[key(y,m,x)];cal.innerHTML+=`<button class="day ${r?'has':''}" onclick="openEdit('${key(y,m,x)}')"><b>${x}</b>${r?`<div class="sale">税込 ${money(r.gross)}</div><div class="sale">税抜 ${money(r.net)}</div>`:''}</button>`}}
function openEdit(k){sel=k;let r=db.reports[k]||{start:'',end:'',gross:'',net:'',rate:db.defaultRate};dateTitle.textContent=k+' 日報';start.value=r.start;end.value=r.end;gross.value=r.gross;net.value=r.net;rate.value=r.rate;calc();page('edit')}
function calc(){pay.textContent=money((+net.value||0)*(+rate.value||0)/100)}net.oninput=rate.oninput=calc
function save(){let n=+net.value||0,rt=+rate.value||0;db.reports[sel]={start:start.value,end:end.value,gross:+gross.value||0,net:n,rate:rt,pay:Math.round(n*rt/100)};persist();page('cal')}
function del(){if(confirm(sel+'の日報を削除しますか？')){delete db.reports[sel];persist();page('cal')}}
function monthly(){let p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),s={g:0,n:0,p:0,days:0};Object.entries(db.reports).forEach(([k,r])=>{if(k.startsWith(p)){s.g+=+r.gross||0;s.n+=+r.net||0;s.p+=+r.pay||0;s.days++}});mt.textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月';mg.textContent=money(s.g);mn.textContent=money(s.n);mp.textContent=money(s.p);md.textContent=s.days+'日';goal.value=db.goals[p]||'';remain.textContent=goal.value?(s.g<goal.value?'目標まで残り '+money(goal.value-s.g):'目標達成！'):''}
function goalSave(){let p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');db.goals[p]=+goal.value||0;persist();monthly()}
function yearly(){let y=d.getFullYear(),s={g:0,n:0,p:0,days:0},rows='';yt.textContent=y+'年';for(let m=1;m<=12;m++){let p=y+'-'+String(m).padStart(2,'0'),x={g:0,n:0,p:0,days:0};Object.entries(db.reports).forEach(([k,r])=>{if(k.startsWith(p)){x.g+=+r.gross||0;x.n+=+r.net||0;x.p+=+r.pay||0;x.days++}});s.g+=x.g;s.n+=x.n;s.p+=x.p;s.days+=x.days;rows+=`<p>${m}月　税込 ${money(x.g)}　税抜 ${money(x.n)}　総支給 ${money(x.p)}</p>`}yg.textContent=money(s.g);yn.textContent=money(s.n);yp.textContent=money(s.p);yd.textContent=s.days+'日';years.innerHTML=rows}
function settingsSave(){db.defaultRate=+defrate.value||50;persist();alert('保存しました')}
render();
</script></body></html>
