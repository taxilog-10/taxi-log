<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6f8">
<title>Taxi Log</title>

<style>
:root{
  --bg:#f5f6f8;
  --card:#fff;
  --text:#15171a;
  --muted:#73777d;
  --line:#e3e5e8;
  --accent:#111;
  --danger:#d93025;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px 14px calc(12px + env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.topbtn{
  width:42px;
  height:38px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  font-size:21px;
}

main{
  max-width:720px;
  margin:auto;
  padding:14px 12px 100px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.03);
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
}

.between{
  justify-content:space-between;
}

.center{
  justify-content:center;
}

h2,h3,p{
  margin-top:0;
}

.monthTitle{
  font-size:20px;
  font-weight:800;
}

.navbtn{
  width:42px;
  height:40px;
  border:1px solid var(--line);
  background:#f7f7f8;
  border-radius:11px;
  font-size:22px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.dow{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:5px 0;
}

.day{
  min-height:82px;
  border:1px solid var(--line);
  background:#fafafa;
  border-radius:10px;
  padding:6px;
  text-align:left;
  color:#111;
  font:inherit;
  overflow:hidden;
}

.day.empty{
  border:0;
  background:transparent;
}

.day.today{
  outline:2px solid #111;
  outline-offset:-2px;
}

.day.work{
  background:#f0f4f8;
}

.day.boarding{
  background:#f4f1ff;
}

.num{
  font-weight:800;
  font-size:14px;
}

.sale{
  font-size:9.5px;
  color:#555;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:5px;
}

.workmark{
  font-size:9px;
  margin-top:4px;
  color:#111;
  font-weight:700;
}

.boardmark{
  font-size:9px;
  margin-top:4px;
  color:#5b3bb5;
  font-weight:800;
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  margin:13px 0 6px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #cfd2d6;
  border-radius:11px;
  background:#fff;
  font:inherit;
  font-size:16px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.statgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#f7f7f8;
  border-radius:12px;
  padding:12px;
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:4px;
}

.stat strong{
  font-size:20px;
}

.primary,
.secondary,
.danger{
  border:0;
  border-radius:11px;
  padding:12px 15px;
  font:inherit;
  font-weight:700;
}

.primary{
  background:#111;
  color:#fff;
}

.secondary{
  background:#eceef1;
  color:#111;
}

.danger{
  background:#fff0ef;
  color:var(--danger);
}

.actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.actions button{
  flex:1;
}

.menu{
  position:fixed;
  right:12px;
  top:62px;
  z-index:30;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.16);
}

.menu button{
  display:block;
  width:240px;
  text-align:left;
  margin:3px;
  border:0;
  background:#fff;
  padding:12px;
  border-radius:9px;
  font:inherit;
}

.hidden{
  display:none!important;
}

.back{
  margin-bottom:10px;
}

.progress{
  height:10px;
  background:#e8eaed;
  border-radius:20px;
  overflow:hidden;
}

.progress>div{
  height:100%;
  background:#111;
  width:0;
}

.note{
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.table th,
.table td{
  border-bottom:1px solid var(--line);
  padding:9px 4px;
  text-align:right;
}

.table th:first-child,
.table td:first-child{
  text-align:left;
}

/* 乗り込み */

.boardingCalendar .day{
  min-height:95px;
}

.boardingCount{
  font-size:15px;
  font-weight:800;
  margin-top:5px;
}

.boardingArea{
  font-size:9px;
  color:#5b3bb5;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:3px;
}

.boardingList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.boardingRow{
  display:grid;
  grid-template-columns:58px 1fr 90px;
  gap:8px;
  align-items:center;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fafafa;
}

.timeLabel{
  font-weight:800;
  font-size:14px;
}

.boardingRow input{
  padding:9px;
  font-size:14px;
}

.countBox{
  display:flex;
  align-items:center;
  gap:5px;
}

.countBox input{
  text-align:center;
  min-width:0;
}

.plusBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:9px;
  background:#111;
  color:#fff;
  font-size:20px;
  font-weight:800;
}

.minusBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:9px;
  background:#e8eaed;
  color:#111;
  font-size:20px;
  font-weight:800;
}

.totalBox{
  background:#f4f1ff;
  border-radius:14px;
  padding:15px;
  text-align:center;
  margin-bottom:12px;
}

.totalBox small{
  display:block;
  color:var(--muted);
}

.totalBox strong{
  display:block;
  font-size:30px;
  margin-top:3px;
}

/* 集計 */

.summaryBlock{
  margin-top:15px;
}

.summaryTitle{
  font-size:15px;
  font-weight:800;
  margin-bottom:8px;
}

.rankRow{
  display:flex;
  justify-content:space-between;
  padding:9px 4px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.rankRow strong{
  font-size:15px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);
  display:flex;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  z-index:25;
}

.bottom button{
  flex:1;
  border:0;
  background:transparent;
  font:inherit;
  color:#555;
  padding:5px;
}

.bottom button.active{
  color:#111;
  font-weight:800;
}

@media(max-width:430px){
  .boardingRow{
    grid-template-columns:52px 1fr 82px;
  }

  .plusBtn,
  .minusBtn{
    width:32px;
    height:36px;
  }

  .boardingRow{
    gap:5px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🚕 Taxi Log</div>
  <button class="topbtn" id="menuBtn">△</button>
</header>

<main>

<!-- =========================
     日報カレンダー
========================= -->

<section id="calendarPage">

  <div class="card">
    <div class="row between">
      <button class="navbtn" id="prevMonth">‹</button>
      <div class="monthTitle" id="calendarTitle"></div>
      <button class="navbtn" id="nextMonth">›</button>
    </div>
  </div>

  <div class="card">
    <div class="calendar" id="calendar"></div>
  </div>

</section>


<!-- =========================
     日報入力
========================= -->

<section id="editPage" class="hidden">

  <div class="row back">
    <button class="secondary" id="backCalendar">
      ← カレンダー
    </button>
  </div>

  <div class="card">

    <h2 id="editTitle">日報</h2>

    <div class="grid2">

      <div>
        <label>出勤時間</label>
        <input type="time" id="start">
      </div>

      <div>
        <label>退勤時間</label>
        <input type="time" id="end">
      </div>

    </div>

    <div class="grid2">

      <div>
        <label>税込売上</label>
        <input
          type="number"
          inputmode="decimal"
          id="gross"
          placeholder="例 73600"
        >
      </div>

      <div>
        <label>税抜売上</label>
        <input
          type="number"
          inputmode="decimal"
          id="net"
          placeholder="例 67750"
        >
      </div>

    </div>

    <label>歩合率（変更可能）</label>

    <input
      type="number"
      inputmode="decimal"
      id="rate"
      step="0.1"
    >

    <div class="statgrid" style="margin-top:12px">

      <div class="stat">
        <small>税込売上</small>
        <strong id="showGross">¥0</strong>
      </div>

      <div class="stat">
        <small>税抜売上</small>
        <strong id="showNet">¥0</strong>
      </div>

      <div class="stat">
        <small>歩合率</small>
        <strong id="showRate">50%</strong>
      </div>

      <div class="stat">
        <small>総支給</small>
        <strong id="showPay">¥0</strong>
      </div>

    </div>

    <div class="actions">

      <button class="primary" id="saveBtn">
        保存
      </button>

      <button class="danger" id="deleteBtn">
        削除
      </button>

    </div>

  </div>

</section>


<!-- =========================
     月間集計
========================= -->

<section id="monthPage" class="hidden">

  <div class="card">

    <div class="row between">

      <button class="navbtn" id="prevMonth2">
        ‹
      </button>

      <h2 id="monthTitle">
        月間集計
      </h2>

      <button class="navbtn" id="nextMonth2">
        ›
      </button>

    </div>

  </div>

  <div class="card">

    <div class="statgrid">

      <div class="stat">
        <small>税込売上</small>
        <strong id="mGross">¥0</strong>
      </div>

      <div class="stat">
        <small>税抜売上</small>
        <strong id="mNet">¥0</strong>
      </div>

      <div class="stat">
        <small>総支給</small>
        <strong id="mPay">¥0</strong>
      </div>

      <div class="stat">
        <small>出勤日数</small>
        <strong id="mDays">0日</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <label>月間目標</label>

    <input
      type="number"
      inputmode="decimal"
      id="goal"
      placeholder="目標を入力"
    >

    <p
      id="goalText"
      class="note"
      style="margin-top:10px"
    >
      目標は未設定です。
    </p>

    <div class="progress">
      <div id="goalBar"></div>
    </div>

  </div>

</section>


<!-- =========================
     年間集計
========================= -->

<section id="yearPage" class="hidden">

  <div class="card">

    <h2 id="yearTitle">
      年間集計
    </h2>

    <div class="statgrid">

      <div class="stat">
        <small>税込売上</small>
        <strong id="yGross">¥0</strong>
      </div>

      <div class="stat">
        <small>税抜売上</small>
        <strong id="yNet">¥0</strong>
      </div>

      <div class="stat">
        <small>総支給</small>
        <strong id="yPay">¥0</strong>
      </div>

      <div class="stat">
        <small>出勤日数</small>
        <strong id="yDays">0日</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <table class="table">

      <thead>
        <tr>
          <th>月</th>
          <th>税込</th>
          <th>税抜</th>
          <th>総支給</th>
        </tr>
      </thead>

      <tbody id="yearRows"></tbody>

    </table>

  </div>

</section>


<!-- =========================
     乗り込みカレンダー
========================= -->

<section id="boardingPage" class="hidden">

  <div class="card">

    <div class="row between">

      <button class="navbtn" id="prevBoardingMonth">
        ‹
      </button>

      <div class="monthTitle" id="boardingTitle"></div>

      <button class="navbtn" id="nextBoardingMonth">
        ›
      </button>

    </div>

  </div>

  <div class="card boardingCalendar">

    <div class="calendar" id="boardingCalendar"></div>

  </div>

  <div class="card">

    <div class="statgrid">

      <div class="stat">
        <small>今月の乗り込み</small>
        <strong id="boardingMonthTotal">0回</strong>
      </div>

      <div class="stat">
        <small>乗り込み日数</small>
        <strong id="boardingMonthDays">0日</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <h3>乗り込み集計</h3>

    <div class="summaryBlock">

      <div class="summaryTitle">
        曜日別
      </div>

      <div id="weekdaySummary"></div>

    </div>

    <div class="summaryBlock">

      <div class="summaryTitle">
        時間別
      </div>

      <div id="hourSummary"></div>

    </div>

    <div class="summaryBlock">

      <div class="summaryTitle">
        エリア別
      </div>

      <div id="areaSummary"></div>

    </div>

  </div>

</section>


<!-- =========================
     乗り込み入力
========================= -->

<section id="boardingEditPage" class="hidden">

  <div class="row back">

    <button class="secondary" id="backBoarding">
      ← 乗り込みカレンダー
    </button>

  </div>

  <div class="card">

    <h2 id="boardingEditTitle">
      乗り込み
    </h2>

    <div class="totalBox">

      <small>この日の乗り込み合計</small>

      <strong id="boardingDayTotal">
        0回
      </strong>

    </div>

    <div class="boardingList" id="boardingList"></div>

    <div class="actions">

      <button class="primary" id="boardingSaveBtn">
        保存
      </button>

      <button class="danger" id="boardingClearBtn">
        この日のデータを削除
      </button>

    </div>

  </div>

</section>


<!-- =========================
     設定
========================= -->

<section id="settingsPage" class="hidden">

  <div class="card">

    <h2>設定</h2>

    <label>初期歩合率</label>

    <input
      type="number"
      id="defaultRate"
      inputmode="decimal"
      step="0.1"
    >

    <p
      class="note"
      style="margin-top:10px"
    >
      新しく日報を作るときの初期値です。
      保存済みの日報の歩合率はそのまま残ります。
    </p>

    <button class="primary" id="settingsSave">
      保存
    </button>

  </div>

</section>

</main>


<!-- =========================
     下部ナビ
========================= -->

<nav class="bottom">

  <button id="navCal" class="active">
    📅<br>カレンダー
  </button>

  <button id="navMonth">
    📊<br>月間
  </button>

  <button id="navBoarding">
    🚕<br>乗り込み
  </button>

</nav>


<!-- =========================
     メニュー
========================= -->

<div id="menu" class="menu hidden">

  <button id="menuMonth">
    📊 月間集計
  </button>

  <button id="menuYear">
    📈 年間集計
  </button>

  <button id="menuBoarding">
    🚕 乗り込みカレンダー
  </button>

  <button id="menuSettings">
    ⚙️ 設定
  </button>

</div>


<script>

/* =========================
   データ
========================= */

const KEY='taxilog1';

let db;

try{
  db=JSON.parse(localStorage.getItem(KEY)||'null');
}catch(e){
  db=null;
}

if(!db){
  db={
    reports:{},
    goals:{},
    boardings:{},
    defaultRate:50
  };
}

if(!db.reports){
  db.reports={};
}

if(!db.goals){
  db.goals={};
}

if(!db.boardings){
  db.boardings={};
}

if(db.defaultRate==null){
  db.defaultRate=50;
}

let viewDate=new Date();
viewDate.setDate(1);

let selectedKey=null;
let selectedBoardingKey=null;


/* =========================
   共通
========================= */

const $=id=>document.getElementById(id);

const money=n=>{
  return '¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');
};

const pad=n=>{
  return String(n).padStart(2,'0');
};

const key=(y,m,d)=>{
  return `${y}-${pad(m)}-${pad(d)}`;
};

const saveDB=()=>{
  localStorage.setItem(KEY,JSON.stringify(db));
};


/* =========================
   画面切り替え
========================= */

function show(page){

  [
    'calendarPage',
    'editPage',
    'monthPage',
    'yearPage',
    'boardingPage',
    'boardingEditPage',
    'settingsPage'
  ].forEach(id=>{
    $(id).classList.add('hidden');
  });

  $(page).classList.remove('hidden');

  $('menu').classList.add('hidden');

  $('navCal').classList.remove('active');
  $('navMonth').classList.remove('active');
  $('navBoarding').classList.remove('active');


  if(page==='calendarPage'){
    renderCalendar();
    $('navCal').classList.add('active');
  }

  if(page==='monthPage'){
    renderMonth();
    $('navMonth').classList.add('active');
  }

  if(page==='yearPage'){
    renderYear();
  }

  if(page==='boardingPage'){
    renderBoardingCalendar();
    $('navBoarding').classList.add('active');
  }

  if(page==='settingsPage'){
    $('defaultRate').value=db.defaultRate;
  }

}


/* =========================
   日報カレンダー
========================= */

function renderCalendar(){

  const y=viewDate.getFullYear();
  const m=viewDate.getMonth()+1;

  $('calendarTitle').textContent=
    `${y}年${m}月`;

  const cal=$('calendar');

  cal.innerHTML='';


  [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ].forEach(x=>{

    const e=document.createElement('div');

    e.className='dow';

    e.textContent=x;

    cal.appendChild(e);

  });


  const first=
    new Date(y,m-1,1).getDay();

  const days=
    new Date(y,m,0).getDate();


  for(let i=0;i<first;i++){

    const e=document.createElement('div');

    e.className='day empty';

    cal.appendChild(e);

  }


  const today=new Date();

  const tk=key(
    today.getFullYear(),
    today.getMonth()+1,
    today.getDate()
  );


  for(let d=1;d<=days;d++){

    const k=key(y,m,d);

    const r=db.reports[k];

    const br=db.boardings[k];

    const b=document.createElement('button');

    b.className=
      'day'
      +(r?' work':'')
      +(k===tk?' today':'')
      +(br&&boardingTotal(br)>0?' boarding':'');


    let s=
      `<div class="num">${d}</div>`;


    if(r){

      s+=
        `<div class="sale">税込 ${money(r.gross)}</div>`+
        `<div class="sale">税抜 ${money(r.net)}</div>`+
        `<div class="workmark">出勤 • 総支給 ${money(r.pay)}</div>`;

    }


    if(br){

      const total=boardingTotal(br);

      if(total>0){

        s+=
          `<div class="boardmark">🚕 乗り込み ${total}回</div>`;

      }

    }


    b.innerHTML=s;

    b.onclick=()=>{
      openEdit(k);
    };

    cal.appendChild(b);

  }

}


/* =========================
   日報入力
========================= */

function openEdit(k){

  selectedKey=k;

  const r=db.reports[k]||{};


  $('editTitle').textContent=
    `${k} 日報`;

  $('start').value=
    r.start||'';

  $('end').value=
    r.end||'';

  $('gross').value=
    r.gross??'';

  $('net').value=
    r.net??'';

  $('rate').value=
    r.rate??db.defaultRate;


  $('deleteBtn').style.visibility=
    db.reports[k]
    ?'visible'
    :'hidden';


  updatePreview();

  show('editPage');

}


/* =========================
   日報プレビュー
========================= */

function updatePreview(){

  const g=
    Number($('gross').value)||0;

  const n=
    Number($('net').value)||0;

  const rt=

/* =========================
   月間集計
========================= */

function monthStats(y,m){

  const prefix=
    `${y}-${pad(m)}`;

  const s={
    g:0,
    n:0,
    p:0,
    days:0
  };


  Object.entries(db.reports)
    .forEach(([k,r])=>{

      if(k.startsWith(prefix)){

        s.g+=Number(r.gross)||0;

        s.n+=Number(r.net)||0;

        s.p+=Number(r.pay)||0;

        s.days++;

      }

    });


  return s;

}


/* =========================
   月間画面
========================= */

function renderMonth(){

  const y=
    viewDate.getFullYear();

  const m=
    viewDate.getMonth()+1;

  const s=
    monthStats(y,m);

  const mk=
    `${y}-${pad(m)}`;


  $('monthTitle').textContent=
    `${y}年${m}月`;


  $('mGross').textContent=
    money(s.g);

  $('mNet').textContent=
    money(s.n);

  $('mPay').textContent=
    money(s.p);

  $('mDays').textContent=
    s.days+'日';


  $('goal').value=
    db.goals[mk]||'';


  const goal=
    Number(db.goals[mk])||0;


  if(!goal){

    $('goalText').textContent=
      '目標は未設定です。';

    $('goalBar').style.width=
      '0%';

  }else if(s.g>=goal){

    $('goalText').textContent=
      `目標達成！ ${money(s.g-goal)}円上回っています。`;

    $('goalBar').style.width=
      '100%';

  }else{

    $('goalText').textContent=
      `目標まで残り ${money(goal-s.g)}。`;

    $('goalBar').style.width=
      Math.min(100,s.g/goal*100)+'%';

  }

}

/* =========================

function renderYear(){

  const y=

  let t={
    g:0,
    n:0,

      `<td>${money(s.n)}</td>`+
      `<td>${money(s.p)}</td>`+
      `</tr>`;

  }


  $('yGross').textContent=
    money(t.g);

  $('yNet').textContent=
    money(t.n);

  $('yPay').textContent=
    money(t.p);

  $('yDays').textContent=
    t.days+'日';

  $('yearRows').innerHTML=
    html;

}


/* =========================
   乗り込み
========================= */

const BOARDING_HOURS=[
  '19:00',
  '20:00',
  '21:00',
  '22:00',
  '23:00',
  '00:00',
  '01:00',
  '02:00',
  '03:00',
  '04:00',
  '05:00'
];

const WEEKDAYS=[
  '日',
  '月',
  '火',
  '水',
  '木',
  '金',
  '土'
];


/* データ形式を整える */

function getBoardingData(k){

  if(!db.boardings[k]){
    db.boardings[k]={};
  }

  BOARDING_HOURS.forEach(hour=>{

    if(!db.boardings[k][hour]){

      db.boardings[k][hour]={
        area:'',
        count:0
      };

    }

  });

  return db.boardings[k];

}


/* その日の合計 */

function boardingTotal(data){

  if(!data){
    return 0;
  }

  let total=0;

  Object.values(data).forEach(v=>{

    if(v){
      total+=Number(v.count)||0;
    }

  });

  return total;

}


/* =========================
   乗り込みカレンダー
========================= */

function renderBoardingCalendar(){

  const y=
    viewDate.getFullYear();

  const m=
    viewDate.getMonth()+1;


  $('boardingTitle').textContent=
    `${y}年${m}月`;


  const cal=
    $('boardingCalendar');

  cal.innerHTML='';


  WEEKDAYS.forEach(x=>{

    const e=
      document.createElement('div');

    e.className='dow';

    e.textContent=x;

    cal.appendChild(e);

  });


  const first=
    new Date(y,m-1,1).getDay();

  const days=
    new Date(y,m,0).getDate();


  for(let i=0;i<first;i++){

    const e=
      document.createElement('div');

    e.className='day empty';

    cal.appendChild(e);

  }


  const today=new Date();

  const tk=key(
    today.getFullYear(),
    today.getMonth()+1,
    today.getDate()
  );


  for(let d=1;d<=days;d++){

    const k=
      key(y,m,d);

    const data=
      db.boardings[k];

    const total=
      boardingTotal(data);


    const b=
      document.createElement('button');


    b.className=
      'day'
      +(total>0?' boarding':'')
      +(k===tk?' today':'');


    let html=
      `<div class="num">${d}</div>`;


    if(total>0){

      html+=
        `<div class="boardingCount">${total}回</div>`;


      const areas=[];

      Object.values(data).forEach(v=>{

        if(
          v &&
          v.area &&
          Number(v.count)>0 &&
          !areas.includes(v.area)
        ){
          areas.push(v.area);
        }

      });


      if(areas.length){

        html+=
          `<div class="boardingArea">${areas.join(' / ')}</div>`;

      }

    }


    b.innerHTML=html;


    b.onclick=()=>{
      openBoardingEdit(k);
    };


    cal.appendChild(b);

  }


  renderBoardingMonthStats();

}


/* =========================
   乗り込み入力画面
========================= */

function openBoardingEdit(k){

  selectedBoardingKey=k;

/* =========================
   乗り込み入力
========================= */

function renderBoardingInputs(){

  const data=
    getBoardingData(selectedBoardingKey);

  const list=
    $('boardingList');

  list.innerHTML='';


  BOARDING_HOURS.forEach(hour=>{

    const v=
      data[hour]||{
        area:'',
        count:0
      };


    const row=
      document.createElement('div');

    row.className='boardingRow';


    const time=
      document.createElement('div');

    time.className='timeLabel';

    time.textContent=
      hour;


    const area=
      document.createElement('input');

    area.type='text';

    area.placeholder='エリア';

    area.value=
      v.area||'';


    area.dataset.hour=hour;


    const countBox=
      document.createElement('div');

    countBox.className='countBox';


    const minus=
      document.createElement('button');

    minus.className='minusBtn';

    minus.type='button';

    minus.textContent='−';


    const count=
      document.createElement('input');

    count.type='number';

    count.inputMode='numeric';

    count.min='0';

    count.value=
      Number(v.count)||0;

    count.dataset.hour=hour;

    count.className='boardingCountInput';


    const plus=
      document.createElement('button');

    plus.className='plusBtn';

    plus.type='button';

    plus.textContent='+';


    plus.onclick=()=>{

      count.value=
        (Number(count.value)||0)+1;

      updateBoardingDayTotal();

    };


    minus.onclick=()=>{

      count.value=
        Math.max(
          0,
          (Number(count.value)||0)-1
        );

      updateBoardingDayTotal();

    };


    count.addEventListener(
      'input',
      updateBoardingDayTotal
    );


    countBox.appendChild(minus);

    countBox.appendChild(count);

    countBox.appendChild(plus);


    row.appendChild(time);

    row.appendChild(area);

    row.appendChild(countBox);


    list.appendChild(row);

  });


  updateBoardingDayTotal();

}


/* =========================
   入力中の合計
========================= */

function updateBoardingDayTotal(){

  let total=0;


  document
    .querySelectorAll('.boardingCountInput')
    .forEach(input=>{

      total+=
        Number(input.value)||0;

    });


  $('boardingDayTotal').textContent=
    total+'回';

}

/* =========================
   乗り込み月間合計
========================= */

function getBoardingMonthData(y,m){

  const prefix=
    `${y}-${pad(m)}`;

  let total=0;
  let days=0;

  Object.entries(db.boardings)
    .forEach(([k,data])=>{

      if(k.startsWith(prefix)){

        const t=
          boardingTotal(data);

        if(t>0){

          total+=t;

          days++;

        }

      }

    });


  return {
    total,
    days
  };

}


/* =========================
   乗り込み集計
========================= */

function getBoardingSummary(y,m){

  const prefix=
    `${y}-${pad(m)}`;

  const weekday={
    日:0,
    月:0,
    火:0,
    水:0,
    木:0,
    金:0,
    土:0
  };

  const hour={};

  const area={};


  BOARDING_HOURS.forEach(h=>{
    hour[h]=0;
  });


  Object.entries(db.boardings)
    .forEach(([k,data])=>{

      if(!k.startsWith(prefix)){
        return;
      }


      const parts=k.split('-');

      const ky=
        Number(parts[0]);

      const km=
        Number(parts[1]);

      const kd=
        Number(parts[2]);


      const date=
        new Date(ky,km-1,kd);


      const wd=
        WEEKDAYS[date.getDay()];


      Object.entries(data||{})
        .forEach(([h,v])=>{

          const count=
            Number(v&&v.count)||0;


          if(count<=0){
            return;
          }


          weekday[wd]+=count;

          if(hour[h]==null){
            hour[h]=0;
          }

          hour[h]+=count;


          const a=
            (v.area||'未入力').trim() ||
            '未入力';


          if(area[a]==null){
            area[a]=0;
          }

          area[a]+=count;

        });

    });


  return {
    weekday,
    hour,
    area
  };

}


/* =========================
   集計表示
========================= */

function makeRankRows(obj,labelSuffix){

  const entries=
    Object.entries(obj)
      .sort((a,b)=>b[1]-a[1]);


  if(!entries.length){

    return '<div class="note">まだデータがありません。</div>';

  }


  let html='';


  entries.forEach(([name,value])=>{

    html+=
      `<div class="rankRow">`+
      `<span>${name}</span>`+
      `<strong>${value}${labelSuffix}</strong>`+
      `</div>`;

  });


  return html;

}


function renderBoardingMonthStats(){

  const y=
    viewDate.getFullYear();

  const m=
    viewDate.getMonth()+1;


  const month=
    getBoardingMonthData(y,m);


  $('boardingMonthTotal').textContent=
    month.total+'回';

  $('boardingMonthDays').textContent=
    month.days+'日';


  const summary=
    getBoardingSummary(y,m);


  $('weekdaySummary').innerHTML=
    makeRankRows(
      summary.weekday,
      '回'
    );


  $('hourSummary').innerHTML=
    makeRankRows(
      summary.hour,
      '回'
    );


  $('areaSummary').innerHTML=
    makeRankRows(
      summary.area,
      '回'
    );

}
