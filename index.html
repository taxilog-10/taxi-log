<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9">
<title>Taxi Log</title>

<style>
:root{
  --bg:#f5f6f8;
  --card:#fff;
  --text:#15171a;
  --muted:#73777d;
  --line:#e3e5e8;
  --accent:#111;
  --danger:#d93025
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px 14px calc(12px + env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  font-size:21px;
  font-weight:800
}

.topbtn{
  width:42px;
  height:38px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  font-size:21px
}

main{
  max-width:720px;
  margin:auto;
  padding:14px 12px 90px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.03)
}

.row{
  display:flex;
  align-items:center;
  gap:8px
}

.between{
  justify-content:space-between
}

h2,h3,p{
  margin-top:0
}

.monthTitle{
  font-size:20px;
  font-weight:800
}

.navbtn{
  width:42px;
  height:40px;
  border:1px solid var(--line);
  background:#f7f7f8;
  border-radius:11px;
  font-size:22px
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px
}

.dow{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:5px 0
}

.day{
  min-height:82px;
  border:1px solid var(--line);
  background:#fafafa;
  border-radius:10px;
  padding:6px;
  text-align:left;
  color:#111;
  font:inherit;
  overflow:hidden
}

.day.empty{
  border:0;
  background:transparent
}

.day.today{
  outline:2px solid #111;
  outline-offset:-2px
}

.day.work{
  background:#f0f4f8
}

.num{
  font-weight:800;
  font-size:14px
}

.sale{
  font-size:9.5px;
  color:#555;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:5px
}

.workmark{
  font-size:9px;
  margin-top:4px;
  color:#111;
  font-weight:700
}

label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  margin:13px 0 6px
}

input{
  width:100%;
  padding:12px;
  border:1px solid #cfd2d6;
  border-radius:11px;
  background:#fff;
  font:inherit;
  font-size:16px
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.statgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.stat{
  background:#f7f7f8;
  border-radius:12px;
  padding:12px
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:4px
}

.stat strong{
  font-size:20px
}

.primary,.secondary,.danger{
  border:0;
  border-radius:11px;
  padding:12px 15px;
  font:inherit;
  font-weight:700
}

.primary{
  background:#111;
  color:#fff
}

.secondary{
  background:#eceef1;
  color:#111
}

.danger{
  background:#fff0ef;
  color:var(--danger)
}

.actions{
  display:flex;
  gap:8px;
  margin-top:16px
}

.actions button{
  flex:1
}

.menu{
  position:fixed;
  right:12px;
  top:62px;
  z-index:30;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.16)
}

.menu button{
  display:block;
  width:240px;
  text-align:left;
  margin:3px;
  border:0;
  background:#fff;
  padding:12px;
  border-radius:9px;
  font:inherit
}

.hidden{
  display:none!important
}

.back{
  margin-bottom:10px
}

.progress{
  height:10px;
  background:#e8eaed;
  border-radius:20px;
  overflow:hidden
}

.progress>div{
  height:100%;
  background:#111;
  width:0
}

.note{
  font-size:13px;
  color:var(--muted);
  line-height:1.5
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

.table th,.table td{
  border-bottom:1px solid var(--line);
  padding:9px 4px;
  text-align:right
}

.table th:first-child,
.table td:first-child{
  text-align:left
}

.ride-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}

.ride-table th{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  padding:8px 4px;
  border-bottom:1px solid var(--line);
  text-align:left
}

.ride-table td{
  padding:7px 4px;
  border-bottom:1px solid var(--line);
  vertical-align:middle
}

.ride-time{
  width:65px;
  font-weight:700;
  white-space:nowrap
}

.ride-area{
  width:auto
}

.ride-count{
  width:70px
}

.ride-input{
  width:100%;
  padding:9px 7px;
  font-size:14px
}

.ride-total{
  text-align:center;
  font-size:26px;
  font-weight:800;
  margin:8px 0
}

.week-table{
  width:100%;
  border-collapse:collapse
}

.week-table th,
.week-table td{
  padding:10px 5px;
  border-bottom:1px solid var(--line);
  text-align:left
}

.week-table th:last-child,
.week-table td:last-child{
  text-align:right
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);
  display:flex;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  z-index:25
}

.bottom button{
  flex:1;
  border:0;
  background:transparent;
  font:inherit;
  color:#555;
  padding:5px
}

.bottom button.active{
  color:#111;
  font-weight:800
}
</style>
</head>

<body>

<header>
  <div class="logo">🚕 Taxi Log</div>
  <button class="topbtn" id="menuBtn">△</button>
</header>

<main>

<!-- ==================== 日報カレンダー ==================== -->

<section id="calendarPage">

  <div class="card">
    <div class="row between">
      <button class="navbtn" id="prevMonth">‹</button>
      <div class="monthTitle" id="calendarTitle"></div>
      <button class="navbtn" id="nextMonth">›</button>
    </div>
  </div>

  <div class="card">
    <div class="calendar" id="calendar"></div>
  </div>

</section>


<!-- ==================== 日報入力 ==================== -->

<section id="editPage" class="hidden">

  <div class="row back">
    <button class="secondary" id="backCalendar">
      ← カレンダー
    </button>
  </div>

  <div class="card">

    <h2 id="editTitle">日報</h2>

    <div class="grid2">

      <div>
        <label>出勤時間</label>
        <input type="time" id="start">
      </div>

      <div>
        <label>退勤時間</label>
        <input type="time" id="end">
      </div>

    </div>

    <div class="grid2">

      <div>
        <label>税込売上</label>
        <input
          type="number"
          inputmode="decimal"
          id="gross"
          placeholder="例 73600"
        >
      </div>

      <div>
        <label>税抜売上</label>
        <input
          type="number"
          inputmode="decimal"
          id="net"
          placeholder="例 67750"
        >
      </div>

    </div>

    <label>歩合率（変更可能）</label>

    <input
      type="number"
      inputmode="decimal"
      id="rate"
      step="0.1"
    >

    <div class="statgrid" style="margin-top:12px">

      <div class="stat">
        <small>税込売上</small>
        <strong id="showGross">¥0</strong>
      </div>

      <div class="stat">
        <small>税抜売上</small>
        <strong id="showNet">¥0</strong>
      </div>

      <div class="stat">
        <small>歩合率</small>
        <strong id="showRate">50%</strong>
      </div>

      <div class="stat">
        <small>総支給</small>
        <strong id="showPay">¥0</strong>
      </div>

    </div>

    <div class="actions">

      <button class="primary" id="saveBtn">
        保存
      </button>

      <button class="danger" id="deleteBtn">
        削除
      </button>

    </div>

  </div>

</section>


<!-- ==================== 月間集計 ==================== -->

<section id="monthPage" class="hidden">

  <div class="card">

    <div class="row between">

      <button class="navbtn" id="prevMonth2">
        ‹
      </button>

      <h2 id="monthTitle">
        月間集計
      </h2>

      <button class="navbtn" id="nextMonth2">
        ›
      </button>

    </div>

  </div>

  <div class="card">

    <div class="statgrid">

      <div class="stat">
        <small>税込売上</small>
        <strong id="mGross">¥0</strong>
      </div>

      <div class="stat">
        <small>税抜売上</small>
        <strong id="mNet">¥0</strong>
      </div>

      <div class="stat">
        <small>総支給</small>
        <strong id="mPay">¥0</strong>
      </div>

      <div class="stat">
        <small>出勤日数</small>
        <strong id="mDays">0日</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <label>月間目標</label>

    <input
      type="number"
      inputmode="decimal"
      id="goal"
      placeholder="目標を入力"
    >

    <p id="goalText" class="note" style="margin-top:10px">
      目標は未設定です。
    </p>

    <div class="progress">
      <div id="goalBar"></div>
    </div>

  </div>

</section>


<!-- ==================== 年間集計 ==================== -->

<section id="yearPage" class="hidden">

  <div class="card">

    <div class="row between">

      <button class="navbtn" id="prevYear">
        ‹
      </button>

      <h2 id="yearTitle">
        年間集計
      </h2>

      <button class="navbtn" id="nextYear">
        ›
      </button>

    </div>

    <div class="statgrid">

      <div class="stat">
        <small>税込売上</small>
        <strong id="yGross">¥0</strong>
      </div>

      <div class="stat">
        <small>税抜売上</small>
        <strong id="yNet">¥0</strong>
      </div>

      <div class="stat">
        <small>総支給</small>
        <strong id="yPay">¥0</strong>
      </div>

      <div class="stat">
        <small>出勤日数</small>
        <strong id="yDays">0日</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <table class="table">

      <thead>
        <tr>
          <th>月</th>
          <th>税込</th>
          <th>税抜</th>
          <th>総支給</th>
        </tr>
      </thead>

      <tbody id="yearRows"></tbody>

    </table>

  </div>

</section>


<!-- ==================== 乗り込みカレンダー ==================== -->

<section id="rideCalendarPage" class="hidden">

  <div class="card">

    <div class="row between">

      <button class="navbtn" id="prevRideMonth">
        ‹
      </button>

      <div class="monthTitle" id="rideCalendarTitle"></div>

      <button class="navbtn" id="nextRideMonth">
        ›
      </button>

    </div>

  </div>

  <div class="card">

    <div class="calendar" id="rideCalendar"></div>

  </div>

  <div class="card">

    <h2>曜日別累計</h2>

    <table class="week-table">

      <thead>
        <tr>
          <th>曜日</th>
          <th>乗り込み回数</th>
        </tr>
      </thead>

      <tbody id="weekdayRows"></tbody>

    </table>

  </div>

</section>


<!-- ==================== 乗り込み入力 ==================== -->

<section id="rideEditPage" class="hidden">

  <div class="row back">

    <button class="secondary" id="backRideCalendar">
      ← 乗り込みカレンダー
    </button>

  </div>

  <div class="card">

    <h2 id="rideEditTitle">乗り込み</h2>

    <div class="ride-total">
      合計 <span id="rideTotal">0</span> 回
    </div>

    <table class="ride-table">

      <thead>
        <tr>
          <th>時間</th>
          <th>エリア</th>
          <th>回数</th>
        </tr>
      </thead>

      <tbody id="rideRows"></tbody>

    </table>

    <div class="actions">

      <button class="primary" id="saveRideBtn">
        保存
      </button>

      <button class="danger" id="clearRideBtn">
        この日のデータを削除
      </button>

    </div>

  </div>

</section>


<!-- ==================== 設定 ==================== -->

<section id="settingsPage" class="hidden">

  <div class="card">

    <h2>設定</h2>

    <label>初期歩合率</label>

    <input
      type="number"
      id="defaultRate"
      inputmode="decimal"
      step="0.1"
    >

    <p class="note" style="margin-top:10px">
      新しく日報を作るときの初期値です。
      保存済みの日報の歩合率はそのまま残ります。
    </p>

    <button class="primary" id="settingsSave">
      保存
    </button>

  </div>

</section>

</main>


<!-- ==================== 下部ナビ ==================== -->

<nav class="bottom">

  <button id="navCal" class="active">
    📅<br>カレンダー
  </button>

  <button id="navMonth">
    📊<br>月間
  </button>

</nav>


<!-- ==================== メニュー ==================== -->

<div id="menu" class="menu hidden">

  <button id="menuMonth">
    📊 月間集計
  </button>

  <button id="menuYear">
    📈 年間集計
  </button>

  <button id="menuRide">
    🚕 乗り込みカレンダー
  </button>

  <button id="menuSettings">
    ⚙️ 設定
  </button>

</div>


<script>

const KEY='taxilog1';

let db;

try{

  db=JSON.parse(
    localStorage.getItem(KEY)||'null'
  );

}catch(e){

  db=null;

}


if(!db){

  db={
    reports:{},
    goals:{},
    rides:{},
    defaultRate:50
  };

}


if(!db.reports){
  db.reports={};
}

if(!db.goals){
  db.goals={};
}

if(!db.rides){
  db.rides={};
}

if(db.defaultRate==null){
  db.defaultRate=50;
}


let viewDate=new Date();

viewDate.setDate(1);

let rideViewDate=new Date();

rideViewDate.setDate(1);

let selectedKey=null;

let selectedRideKey=null;


const $=id=>
  document.getElementById(id);


const money=n=>{
  return '¥'+
    Math.round(Number(n)||0)
      .toLocaleString('ja-JP');
};


const pad=n=>{
  return String(n).padStart(2,'0');
};


const key=(y,m,d)=>{
  return `${y}-${pad(m)}-${pad(d)}`;
};


const saveDB=()=>{
  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );
};


/* ==================== ページ切り替え ==================== */

function show(page){

  [
    'calendarPage',
    'editPage',
    'monthPage',
    'yearPage',
    'rideCalendarPage',
    'rideEditPage',
    'settingsPage'
  ].forEach(id=>{
    $(id).classList.add('hidden');
  });


  $(page).classList.remove('hidden');

  $('menu').classList.add('hidden');


  if(page==='calendarPage'){

    renderCalendar();

    $('navCal').classList.add('active');
    $('navMonth').classList.remove('active');

  }else{

    $('navCal').classList.remove('active');

    $('navMonth').classList.toggle(
      'active',
      page==='monthPage'
    );

  }


  if(page==='monthPage'){
    renderMonth();
  }

  if(page==='yearPage'){
    renderYear();
  }

  if(page==='rideCalendarPage'){
    renderRideCalendar();
  }

  if(page==='settingsPage'){
    $('defaultRate').value=
      db.defaultRate;
  }

}


/* ==================== 日報カレンダー ==================== */

function renderCalendar(){

  const y=
    viewDate.getFullYear();

  const m=
    viewDate.getMonth()+1;


  $('calendarTitle').textContent=
    `${y}年${m}月`;


  const cal=
    $('calendar');

  cal.innerHTML='';


  [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ].forEach(x=>{

    const e=
      document.createElement('div');

    e.className='dow';

    e.textContent=x;

    cal.appendChild(e);

  });


  const first=
    new Date(y,m-1,1).getDay();

  const days=
    new Date(y,m,0).getDate();


  for(let i=0;i<first;i++){

    const e=
      document.createElement('div');

    e.className='day empty';

    cal.appendChild(e);

  }


  const today=
    new Date();

  const tk=
    key(
      today.getFullYear(),
      today.getMonth()+1,
      today.getDate()
    );


  for(let d=1;d<=days;d++){

    const k=
      key(y,m,d);

    const r=
      db.reports[k];


    const b=
      document.createElement('button');

    b.className=
      'day'
      +(r?' work':'')
      +(k===tk?' today':'');


    let s=
      `<div class="num">${d}</div>`;


    if(r){

      s+=
        `<div class="sale">税込 ${money(r.gross)}</div>`+
        `<div class="sale">税抜 ${money(r.net)}</div>`+
        `<div class="workmark">出勤 • 総支給 ${money(r.pay)}</div>`;

    }


    b.innerHTML=s;


    b.onclick=()=>{
      openEdit(k);
    };


    cal.appendChild(b);

  }

}


/* ==================== 日報編集 ==================== */

function openEdit(k){

  selectedKey=k;

  const r=
    db.reports[k]||{};


  $('editTitle').textContent=
    `${k} 日報`;


  $('start').value=
    r.start||'';

  $('end').value=
    r.end||'';

  $('gross').value=
    r.gross??'';

  $('net').value=
    r.net??'';

  $('rate').value=
    r.rate??db.defaultRate;


  $('deleteBtn').style.visibility=
    db.reports[k]
      ?'visible'
      :'hidden';


  updatePreview();

  show('editPage');

}


/* ==================== 日報プレビュー ==================== */

function updatePreview(){

  const g=
    Number($('gross').value)||0;

  const n=
    Number($('net').value)||0;

  const rt=
    Number($('rate').value)||0;


  $('showGross').textContent=
    money(g);

  $('showNet').textContent=
    money(n);

  $('showRate').textContent=
    rt+'%';

  $('showPay').textContent=
    money(n*rt/100);

}


[
  'gross',
  'net',
  'rate'
].forEach(id=>{

  $(id).addEventListener(
    'input',
    updatePreview
  );

});


/* ==================== 日報保存 ==================== */

$('saveBtn').onclick=()=>{

  const g=
    Number($('gross').value)||0;

  const n=
    Number($('net').value)||0;

  const rt=
    Number($('rate').value)||0;


  db.reports[selectedKey]={

    start:$('start').value,

    end:$('end').value,

    gross:g,

    net:n,

    rate:rt,

    pay:Math.round(
      n*rt/100
    )

  };


  saveDB();

  show('calendarPage');

};


/* ==================== 日報削除 ==================== */

$('deleteBtn').onclick=()=>{

  if(!db.reports[selectedKey]){
    return;
  }


  if(
    confirm(
      `${selectedKey}の日報を削除しますか？`
    )
  ){

    delete db.reports[selectedKey];

    saveDB();

    show('calendarPage');

  }

};


/* ==================== カレンダーへ戻る ==================== */

$('backCalendar').onclick=()=>{
  show('calendarPage');
};


/* ==================== 月移動 ==================== */

$('prevMonth').onclick=
$('prevMonth2').onclick=()=>{

  viewDate.setMonth(
    viewDate.getMonth()-1
  );


  if(
    !$('monthPage')
      .classList
      .contains('hidden')
  ){

    renderMonth();

  }else{

    renderCalendar();

  }

};


$('nextMonth').onclick=
$('nextMonth2').onclick=()=>{

  viewDate.setMonth(
    viewDate.getMonth()+1
  );


  if(
    !$('monthPage')
      .classList
      .contains('hidden')
  ){

    renderMonth();

  }else{

    renderCalendar();

  }

};


/* ==================== 月間集計 ==================== */

function monthStats(y,m){

  const prefix=
    `${y}-${pad(m)}`;


  const s={
    g:0,
    n:0,
    p:0,
    days:0
  };


  Object.entries(db.reports)
    .forEach(([k,r])=>{

      if(k.startsWith(prefix)){

        s.g+=
          Number(r.gross)||0;

        s.n+=
          Number(r.net)||0;

        s.p+=
          Number(r.pay)||0;

        s.days++;

      }

    });


  return s;

}


/* ==================== 月間画面 ==================== */

function renderMonth(){

  const y=
    viewDate.getFullYear();

  const m=
    viewDate.getMonth()+1;

  const s=
    monthStats(y,m);

  const mk=
    `${y}-${pad(m)}`;


  $('monthTitle').textContent=
    `${y}年${m}月`;


  $('mGross').textContent=
    money(s.g);

  $('mNet').textContent=
    money(s.n);

  $('mPay').textContent=
    money(s.p);

  $('mDays').textContent=
    s.days+'日';


  $('goal').value=
    db.goals[mk]||'';


  const goal=
    Number(db.goals[mk])||0;


  if(!goal){

    $('goalText').textContent=
      '目標は未設定です。';

    $('goalBar').style.width=
      '0%';

  }else if(s.g>=goal){

    $('goalText').textContent=
      `目標達成！ ${money(s.g-goal)}円上回っています。`;

    $('goalBar').style.width=
      '100%';

  }else{

    $('goalText').textContent=
      `目標まで残り ${money(goal-s.g)}。`;

    $('goalBar').style.width=
      Math.min(
        100,
        s.g/goal*100
      )+'%';

  }

}


/* ==================== 月間目標 ==================== */

$('goal').oninput=()=>{

  const mk=
    `${viewDate.getFullYear()}-${pad(viewDate.getMonth()+1)}`;


  db.goals[mk]=
    Number($('goal').value)||0;


  saveDB();

  renderMonth();

};


/* ==================== 年間集計 ==================== */

function renderYear(){

  const y=
    viewDate.getFullYear();


  $('yearTitle').textContent=
    `${y}年 年間集計`;


  let t={
    g:0,
    n:0,
    p:0,
    days:0
  };


  let html='';


  for(let m=1;m<=12;m++){

    const s=
      monthStats(y,m);


    t.g+=s.g;
    t.n+=s.n;
    t.p+=s.p;
    t.days+=s.days;


    html+=
      `<tr>`+
      `<td>${m}月</td>`+
      `<td>${money(s.g)}</td>`+
      `<td>${money(s.n)}</td>`+
      `<td>${money(s.p)}</td>`+
      `</tr>`;

  }


  $('yGross').textContent=
    money(t.g);

  $('yNet').textContent=
    money(t.n);

  $('yPay').textContent=
    money(t.p);

  $('yDays').textContent=
    t.days+'日';


  $('yearRows').innerHTML=
    html;

}


/* ==================== 年移動 ==================== */

$('prevYear').onclick=()=>{

  viewDate.setFullYear(
    viewDate.getFullYear()-1
  );

  renderYear();

};


$('nextYear').onclick=()=>{

  viewDate.setFullYear(
    viewDate.getFullYear()+1
  );

  renderYear();

};

/* ==================== 乗り込み ==================== */
/* ================================================= */


/* 19:00〜翌5:00 */

const rideTimes=[
  '19:00',
  '20:00',
  '21:00',
  '22:00',
  '23:00',
  '00:00',
  '01:00',
  '02:00',
  '03:00',
  '04:00',
  '05:00'
];


/* ==================== 乗り込みカレンダー ==================== */

function renderRideCalendar(){

  const y=
    rideViewDate.getFullYear();

  const m=
    rideViewDate.getMonth()+1;


  $('rideCalendarTitle').textContent=
    `${y}年${m}月`;


  const cal=
    $('rideCalendar');

  cal.innerHTML='';


  [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ].forEach(x=>{

    const e=
      document.createElement('div');

    e.className='dow';

    e.textContent=x;

    cal.appendChild(e);

  });


  const first=
    new Date(y,m-1,1).getDay();

  const days=
    new Date(y,m,0).getDate();


  for(let i=0;i<first;i++){

    const e=
      document.createElement('div');

    e.className='day empty';

    cal.appendChild(e);

  }


  const today=
    new Date();

  const tk=
    key(
      today.getFullYear(),
      today.getMonth()+1,
      today.getDate()
    );


  for(let d=1;d<=days;d++){

    const k=
      key(y,m,d);

    const r=
      db.rides[k];


    const b=
      document.createElement('button');


    b.className=
      'day'
      +(r?' work':'')
      +(k===tk?' today':'');


    let total=0;


    if(r){

      Object.values(r)
        .forEach(item=>{
          total+=
            Number(item.count)||0;
        });

    }


    let s=
      `<div class="num">${d}</div>`;


    if(total>0){

      s+=
        `<div class="sale">乗り込み ${total}回</div>`;

    }


    b.innerHTML=s;


    b.onclick=()=>{
      openRideEdit(k);
    };


    cal.appendChild(b);

  }


  renderWeekdayStats();

}


/* ==================== 曜日別累計 ==================== */

function renderWeekdayStats(){

  const totals=[
    0,0,0,0,0,0,0
  ];


  const y=
    rideViewDate.getFullYear();

  const m=
    rideViewDate.getMonth()+1;


  Object.entries(db.rides)
    .forEach(([k,data])=>{

      const parts=
        k.split('-');

      const ky=
        Number(parts[0]);

      const km=
        Number(parts[1]);

      if(
        ky!==y||
        km!==m
      ){
        return;
      }


      const date=
        new Date(
          ky,
          km-1,
          Number(parts[2])
        );


      let total=0;


      Object.values(data)
        .forEach(item=>{

          total+=
            Number(item.count)||0;

        });


      totals[date.getDay()]+=total;

    });


  const names=[
    '日曜日',
    '月曜日',
    '火曜日',
    '水曜日',
    '木曜日',
    '金曜日',
    '土曜日'
  ];


  let html='';


  for(let i=0;i<7;i++){

    html+=
      `<tr>`+
      `<td>${names[i]}</td>`+
      `<td>${totals[i]}回</td>`+
      `</tr>`;

  }


  $('weekdayRows').innerHTML=
    html;

}


/* ==================== 乗り込み編集 ==================== */

function openRideEdit(k){

  selectedRideKey=k;


  $('rideEditTitle').textContent=
    `${k} 乗り込み`;


  const data=
    db.rides[k]||{};


  const rows=
    $('rideRows');


  rows.innerHTML='';


  rideTimes.forEach(time=>{

    const item=
      data[time]||{};


    const tr=
      document.createElement('tr');


    tr.innerHTML=
      `<td class="ride-time">${time}</td>`+
      `<td class="ride-area">`+
      `<input class="ride-input ride-area-input" `+
      `data-time="${time}" `+
      `value="${escapeHtml(item.area||'')}" `+
      `placeholder="エリア">`+
      `</td>`+
      `<td class="ride-count">`+
      `<input class="ride-input ride-count-input" `+
      `data-time="${time}" `+
      `type="number" `+
      `inputmode="numeric" `+
      `min="0" `+
      `step="1" `+
      `value="${item.count??''}" `+
      `placeholder="0">`+
      `</td>`;


    rows.appendChild(tr);

  });


  updateRideTotal();

  show('rideEditPage');

}


/* HTML特殊文字対策 */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* ==================== 乗り込み合計 ==================== */

function updateRideTotal(){

  let total=0;


  document
    .querySelectorAll('.ride-count-input')
    .forEach(input=>{

      total+=
        Number(input.value)||0;

    });


  $('rideTotal').textContent=
    total;

}


document.addEventListener(
  'input',
  e=>{

    if(
      e.target.classList.contains(
        'ride-count-input'
      )
    ){

      updateRideTotal();

    }

  }
);


/* ==================== 乗り込み保存 ==================== */

$('saveRideBtn').onclick=()=>{

  const data={};


  rideTimes.forEach(time=>{

    const areaInput=
      document.querySelector(
        `.ride-area-input[data-time="${time}"]`
      );

    const countInput=
      document.querySelector(
        `.ride-count-input[data-time="${time}"]`
      );


    const area=
      areaInput
        ?areaInput.value.trim()
        :'';


    const count=
      countInput
        ?Number(countInput.value)||0
        :0;


    if(area||count){

      data[time]={
        area:area,
        count:count
      };

    }

  });


  if(
    Object.keys(data).length
  ){

    db.rides[selectedRideKey]=data;

  }else{

    delete db.rides[selectedRideKey];

  }


  saveDB();

  show('rideCalendarPage');

};


/* ==================== 乗り込みデータ削除 ==================== */

$('clearRideBtn').onclick=()=>{

  if(
    !db.rides[selectedRideKey]
  ){

    show('rideCalendarPage');
    return;

  }


  if(
    confirm(
      `${selectedRideKey}の乗り込みデータを削除しますか？`
    )
  ){

    delete db.rides[selectedRideKey];

    saveDB();

    show('rideCalendarPage');

  }

};

$('backRideCalendar').onclick=()=>{

};

$('nextRideMonth').onclick=()=>{
